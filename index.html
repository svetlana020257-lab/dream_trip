<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1430">
<title>ГНУ · Путь героя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b1430; --deep:#070c22; --navy:#132150; --navy-2:#1b2c66; --violet:#3a1f6e; --gold:#e9b84c; --gold-dim:#a9822f; --gold-hi:#ffe9b0;
  --parch:#f2e6c6; --muted:#a9b3d6; --trap:#d0493f; --bridge:#55b06b; --fog:#2a0b33; --ok:#8fe3a2; --bad:#ff8f86;
  --pixel:"Press Start 2P","Courier New",monospace; --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#1b1f5a 0%,var(--night) 55%,var(--deep) 100%) fixed;color:var(--parch);font:17px/1.55 var(--serif);padding-top:env(safe-area-inset-top,0px);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{image-rendering:auto}
.px{image-rendering:pixelated}
.wrap{max-width:480px;margin:0 auto;padding:8px 16px calc(var(--nav-h) + 40px)}
.wrap.cur{max-width:720px}
h2{font-family:var(--pixel);font-size:11px;line-height:1.8;color:var(--gold);margin:22px 0 12px;font-weight:400;letter-spacing:.5px}
h3{font-size:18px;margin:18px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.hidden{display:none!important}

/* ---------- шапка и меню ---------- */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 8px;max-width:720px;margin:0 auto;background:linear-gradient(#0b1430f2,#0b1430d0 70%,transparent)}
.logo{font-family:var(--pixel);font-size:16px;letter-spacing:2px;line-height:1;color:var(--parch);text-shadow:2px 2px 0 #000}
.logo small{display:block;font-size:7px;color:var(--gold);margin-top:6px;letter-spacing:1px}
.hright{display:flex;align-items:center;gap:10px}
.weekbadge{font-family:var(--pixel);font-size:7px;line-height:1.9;color:var(--gold);text-align:right}
.sync{font-size:11px;color:var(--muted);text-align:right;min-height:14px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;background:var(--navy);border:2px solid var(--gold-dim);cursor:pointer;padding:0}
.iconbtn svg{width:22px;height:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#070d24;border-top:3px solid var(--gold-dim);box-shadow:0 -4px 0 #000a;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--gold)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:3px;background:var(--gold)}
nav.tabs .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;background:var(--trap);box-shadow:0 0 0 2px #070d24}

/* ---------- пиксельные плашки и кнопки ---------- */
.panel{position:relative;background:linear-gradient(#17225a,#101943);border:3px solid var(--navy-2);padding:14px;margin:0 0 12px;box-shadow:0 4px 0 #0007}
.panel.gold{border-color:var(--gold-dim)}
.frame{position:relative;background:linear-gradient(#1a2766,#0f1842);border:3px solid var(--gold);padding:16px;box-shadow:inset 0 0 0 3px #0b1430,inset 0 0 0 5px #a9822f55,0 5px 0 #000a;
  clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 20px;font-family:var(--pixel);font-size:11px;line-height:1.5;letter-spacing:.5px;color:#1d1400;cursor:pointer;border:0;
  background:linear-gradient(#ffe08a 0,#e9b84c 45%,#c8952f 100%);box-shadow:inset 0 0 0 3px #7a5a1c,inset 0 3px 0 3px #fff3c4aa,0 5px 0 #4a3510;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));transition:transform .08s}
.pbtn:active{transform:translateY(3px)}
.pbtn.dark{color:var(--gold-hi);background:linear-gradient(#2a3a86,#1b2a66);box-shadow:inset 0 0 0 3px var(--gold),inset 0 3px 0 3px #ffffff22,0 5px 0 #000}
.pbtn.wide{width:100%}
.pbtn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.pbtn.small{min-height:40px;padding:10px 12px;font-size:9px}
.btn{background:var(--gold);color:#1d1400;border:0;padding:10px 14px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 var(--gold-dim)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-dim)}
.btn.ghost{background:none;color:var(--gold);border:2px solid var(--gold-dim);box-shadow:none}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{background:#7d2a2a;color:#ffe5e0;box-shadow:0 3px 0 #4a1717}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:#2f6b45;color:#dff5e5;box-shadow:0 3px 0 #1d4a2d}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- живой фон ---------- */
.stage{position:absolute;left:50%;top:50%;width:max(100vw,100vh);height:max(100vw,100vh);transform:translate(-50%,-50%);overflow:hidden}
.stage .cam{position:absolute;inset:0;transform-origin:50% 30%;animation:cam 36s ease-in-out infinite alternate}
.stage .cam>img{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes cam{from{transform:scale(1.18) translateY(3%)}to{transform:scale(1.02) translateY(0)}}
.portal{position:absolute;left:50%;top:23.5%;width:33%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.portal .sw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ffd27a00,#ffd27a88 8%,#ffd27a00 16%,#b46bff66 26%,#b46bff00 34%,#7fd0ff77 44%,#7fd0ff00 52%,#ffd27a88 62%,#ffd27a00 70%,#ff9ad566 80%,#ff9ad500 90%);
  -webkit-mask:radial-gradient(circle,#000 30%,#0008 55%,transparent 70%);mask:radial-gradient(circle,#000 30%,#0008 55%,transparent 70%);animation:spin 14s linear infinite;opacity:.75}
.portal .sw.b{animation-duration:22s;animation-direction:reverse;opacity:.45;transform:scale(.8)}
.portal .core{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,#fffbe6 0,#ffe08acc 30%,#ffb85a00 70%);animation:pulse 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
.isle{position:absolute;overflow:hidden;-webkit-mask:radial-gradient(closest-side,#000 62%,transparent);mask:radial-gradient(closest-side,#000 62%,transparent);animation:bob 6s ease-in-out infinite alternate}
.isle img{position:absolute;max-width:none}
@keyframes bob{from{transform:translateY(.25%)}to{transform:translateY(-1.6%)}}
.fall{position:absolute;mix-blend-mode:screen;opacity:.55;background:repeating-linear-gradient(180deg,#ffffff00 0 6px,#d8f4ff99 6px 9px,#ffffff00 9px 16px);background-size:100% 32px;animation:fall .9s linear infinite}
@keyframes fall{to{background-position:0 32px}}
.plates{position:absolute;left:0;right:0;top:40%;bottom:0;clip-path:polygon(0 100%,100% 100%,70% 0,30% 0);overflow:hidden;mix-blend-mode:screen}
.plates i{position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,transparent,#ffd27a66 45%,#fff3c488 50%,#ffd27a66 55%,transparent);animation:plates 5.5s linear infinite}
.plates i:nth-child(2){animation-delay:-2.75s}
@keyframes plates{from{top:100%}to{top:-25%}}
.star{position:absolute;width:.45%;aspect-ratio:1;background:#fff;box-shadow:0 0 6px #9fd0ff;animation:tw 2.6s steps(3) infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0}50%{opacity:1}}

/* ---------- заставка ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#050817;overflow:hidden;transition:opacity .7s ease}
#splash.hide{opacity:0;pointer-events:none}
.sp-title{position:absolute;left:0;right:0;top:calc(18px + env(safe-area-inset-top,0px));text-align:center;font-family:var(--pixel);color:#fff;text-shadow:3px 3px 0 #1b0f3a,0 0 18px #b46bff;z-index:3;animation:rise 1.4s ease-out both}
.sp-title b{display:block;font-size:34px;letter-spacing:6px;font-weight:400}
.sp-title span{display:block;font-size:11px;color:var(--gold-hi);margin-top:12px;letter-spacing:2px}
@keyframes rise{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.sp-bottom{position:absolute;left:0;right:0;bottom:0;padding:40px 24px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#050817ee 45%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-load{font-family:var(--pixel);font-size:9px;color:var(--gold-hi);letter-spacing:1px}
.sp-bar{width:min(300px,80vw);height:18px;border:3px solid var(--gold);background:#060b1d;padding:2px;box-shadow:0 0 0 3px #000}
.sp-bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ffe08a 0 10px,#e9b84c 10px 12px);animation:bar 2.4s steps(16) forwards}
@keyframes bar{to{width:100%}}
.sp-go{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.sp-go.show{opacity:1;transform:none;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #ffd27a)}50%{filter:drop-shadow(0 0 12px #ffd27a)}}
.sp-skip{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;background:#060b1daa;border:1px solid var(--gold-dim);color:var(--parch);font-size:13px;padding:5px 10px;cursor:pointer}
#splash.warp .cam{animation:none;transition:transform 1.8s cubic-bezier(.6,0,.4,1);transform:scale(3.2)}
#splash.warp .portal{transition:transform 1.8s cubic-bezier(.6,0,.4,1);transform:translate(-50%,-50%) scale(1.4)}
.flash{position:fixed;inset:0;z-index:120;pointer-events:none;background:radial-gradient(circle at 50% 40%,#fffbe6,#ffe08a 40%,#b46bff 100%);opacity:0;transition:opacity .6s}
.flash.on{opacity:1}

/* ---------- онбординг ---------- */
#onb{position:fixed;inset:0;z-index:90;overflow-y:auto;background:#060a1f}
#onb .bg{position:fixed;inset:0;overflow:hidden;opacity:.32;filter:saturate(1.2) blur(1.5px)}
#onb .inner{position:relative;max-width:460px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column}
.pips{display:flex;gap:6px;justify-content:center;margin:0 0 18px}
.pips i{width:22px;height:8px;background:#1b2c66;box-shadow:0 0 0 2px #000}
.pips i.on{background:var(--gold)}
.onb-h{font-family:var(--pixel);font-size:15px;line-height:1.7;color:var(--gold-hi);text-align:center;text-shadow:2px 2px 0 #000;margin:4px 0 8px}
.onb-sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:16px}
.onb-foot{margin-top:auto;padding-top:18px;display:flex;gap:10px}
.onb-foot .pbtn{flex:1}
.onb-foot .pbtn.dark{flex:0 0 64px;padding:14px 0}
.step-in{animation:stepin .45s ease-out both}
@keyframes stepin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tin{width:100%;padding:14px;font-size:20px;background:#0a1233;border:3px solid var(--gold-dim);color:var(--parch);text-align:center}
.tin:focus{border-color:var(--gold);outline:0}

/* карусель классов */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 14% 14px;margin:0 -16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.ccard{flex:0 0 72%;scroll-snap-align:center;position:relative;transition:transform .3s,filter .3s;transform:scale(.9);filter:brightness(.7)}
.ccard.cur{transform:scale(1);filter:none}
.ccard img{width:100%;display:block;box-shadow:0 0 0 3px #000,0 10px 30px #000a}
.ccard.full img{filter:grayscale(1) brightness(.55)}
.ccard .full-l{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--pixel);font-size:10px;line-height:1.7;background:#000c;color:#ffd0cb;padding:8px 10px;border:2px solid var(--trap);text-align:center;white-space:nowrap}
.cinfo{text-align:center;min-height:120px}
.cinfo .nm{font-family:var(--pixel);font-size:14px;color:var(--gold-hi);margin:4px 0 8px}
.chip{display:inline-block;padding:3px 10px;font-size:14px;color:#111;font-weight:700;margin-bottom:8px}
.cinfo .ph{font-style:italic;font-size:17px;line-height:1.45}
.cnav{display:flex;justify-content:center;gap:8px;margin:2px 0 10px}
.cnav i{width:9px;height:9px;background:#26346f}
.cnav i.on{background:var(--gold)}
.hint{font-size:14px;color:var(--muted);text-align:center;border:2px dashed #2a3a7a;padding:8px 10px;margin:0 0 12px}

/* герой-спрайт и гардероб */
.herobox{position:relative;display:grid;place-items:center}
.herobox .plate{position:absolute;bottom:2px;width:70%;height:18px;background:radial-gradient(ellipse at center,#ffd27a88,#ffd27a00 70%);filter:blur(1px)}
.hsprite{display:block;shape-rendering:crispEdges;position:relative;z-index:2}
.breathe{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
.shift{animation:shift 7s steps(1) infinite}
@keyframes shift{0%,40%{transform:translateX(0)}45%,80%{transform:translateX(2px)}85%,100%{transform:translateX(-1px)}}
.aura{position:absolute;inset:-6% -14%;z-index:1;pointer-events:none}
.aura.sparks i,.aura.stars i{position:absolute;width:5px;height:5px;background:#ffe08a;box-shadow:0 0 6px #ffd27a;animation:spark 2.4s linear infinite;opacity:0}
.aura.stars i{background:#fff;box-shadow:0 0 8px #9fd0ff;animation:tw 2s steps(3) infinite}
@keyframes spark{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
.aura.moon{background:radial-gradient(ellipse at 50% 55%,#7fb8ff66,#7fb8ff00 62%);animation:pulse 3.6s ease-in-out infinite}
.aura.flame{background:radial-gradient(ellipse at 50% 92%,#ff7a4d99,#ffb85a44 35%,#ff7a4d00 62%);animation:flick .5s steps(2) infinite alternate}
@keyframes flick{from{opacity:.75;transform:scaleY(1)}to{opacity:1;transform:scaleY(1.06)}}
.aura.gold{background:repeating-conic-gradient(from 0deg at 50% 50%,#ffe08a44 0 6deg,#ffe08a00 6deg 22deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:spin 20s linear infinite}
.wardrobe .cats{display:flex;gap:6px;margin:12px 0 10px}
.wardrobe .cats button{flex:1;background:#0d1640;border:2px solid #26346f;padding:9px 2px;font-size:13px;cursor:pointer}
.wardrobe .cats button[aria-current="true"]{border-color:var(--gold);color:var(--gold-hi);background:#1d2a6a}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{position:relative;aspect-ratio:1;background:#0b1233;border:2px solid #26346f;cursor:pointer;display:grid;place-items:center;padding:4px}
.item[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 12px #ffd27a77;background:#1c2766}
.item.locked{cursor:pointer;filter:grayscale(1) brightness(.55)}
.item .lk{position:absolute;right:3px;top:3px;font-size:13px;filter:none}
.item svg{width:78%;height:78%}
.swatch{width:70%;height:70%;box-shadow:inset 0 0 0 3px #0006}
.itemname{text-align:center;font-size:14px;color:var(--muted);min-height:44px;margin-top:10px}

/* стихии */
.els{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.el{background:#0b1233;border:3px solid #26346f;padding:12px 6px 10px;cursor:pointer;text-align:center}
.el svg{width:56px;height:56px;display:block;margin:0 auto 8px}
.el b{font-family:var(--pixel);font-size:10px;font-weight:400}
.el[aria-pressed="true"]{border-color:var(--tc);box-shadow:0 0 16px var(--tc)}
.el.full{filter:grayscale(1) brightness(.6)}
.assemble{position:relative;width:170px;height:170px;margin:6px auto 4px}
.assemble svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.assemble .part{transition:transform 1s cubic-bezier(.3,1.4,.5,1),opacity .6s}
.assemble .me{filter:drop-shadow(0 0 4px #fff)}
.assemble .tag{position:absolute;font-family:var(--pixel);font-size:9px;border:2px solid var(--gold);color:var(--gold-hi);background:#000a;padding:4px 6px;white-space:nowrap;opacity:0;transition:opacity .5s .9s}
.assemble.done .tag{opacity:1}
.tri-info{margin-top:8px}
.tri-info .k{font-family:var(--pixel);font-size:9px;color:var(--gold);margin:10px 0 4px}

/* свиток */
.scroll{position:relative;background:linear-gradient(#f6ebcc,#e9d6a6);color:#2a1d0c;padding:22px 18px;box-shadow:0 0 0 3px #6b4f17,0 0 0 6px #e9b84c,0 8px 0 6px #000a;margin:10px 4px}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:14px;background:linear-gradient(#b8893a,#7a5a1c);box-shadow:0 0 0 3px #3a2a10}
.scroll::before{top:-14px}.scroll::after{bottom:-14px}
.scroll label{display:block;font-family:var(--pixel);font-size:9px;line-height:1.7;color:#6b3a10;margin:12px 0 6px}
.scroll label:first-child{margin-top:0}
.scroll textarea{width:100%;min-height:70px;background:#fff8e4;border:2px solid #b8893a;color:#2a1d0c;padding:10px;font-size:17px;resize:vertical}
.scroll .tx{font-size:17px;line-height:1.55}
.scroll .tx p{opacity:0;transform:translateY(6px);animation:ink .9s ease-out forwards}
@keyframes ink{to{opacity:1;transform:none}}
.scroll .title{font-family:var(--pixel);font-size:14px;line-height:1.6;text-align:center;color:#6b1f12;margin:10px 0 14px}
.unroll{animation:unroll 1.2s cubic-bezier(.3,.9,.4,1) both;transform-origin:50% 0}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -20px 0)}}
.seal{display:block;width:64px;height:64px;margin:-40px auto 0;position:relative;z-index:2;animation:stamp .6s 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-20deg)}to{opacity:1;transform:none}}
.goal{margin-top:14px;padding-top:12px;border-top:2px dashed #b8893a;font-style:italic}

/* приветствие */
#greet{position:fixed;inset:0;z-index:80;background:#050817e6;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#greet .chars{position:relative;height:min(46vh,330px);max-width:480px;width:100%;margin:0 auto}
.egor{position:absolute;left:4%;bottom:0;height:100%;animation:egorIn .9s ease-out both}
.egor img{height:100%;display:block}
.egor .lamp{position:absolute;left:23.5%;top:13%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#bfe7ffcc,#5fb4ff44 40%,#5fb4ff00 70%);mix-blend-mode:screen;animation:lamp 2.2s infinite}
@keyframes lamp{0%,100%{opacity:.6}20%{opacity:.95}35%{opacity:.7}60%{opacity:1}80%{opacity:.75}}
@keyframes egorIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.yara{position:absolute;right:2%;bottom:0;height:62%;aspect-ratio:270/358;animation:yaraIn 1.1s .3s ease-out both}
.yara img{position:absolute;inset:0;width:100%;height:100%}
.yara .tail{transform-origin:72.8% 70.6%;animation:wag .32s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(9deg)}}
@keyframes yaraIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.yara.hop{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-14px)}}
.bubble{position:relative;max-width:448px;margin:0 auto 14px;width:calc(100% - 32px);background:var(--parch);color:#1d1400;padding:14px 16px 12px;box-shadow:0 0 0 3px #1d1400,0 0 0 6px var(--gold),0 8px 0 6px #000;min-height:120px}
.bubble::after{content:"";position:absolute;bottom:-20px;left:var(--tail,22%);border:10px solid transparent;border-top-color:var(--parch);filter:drop-shadow(0 3px 0 #1d1400)}
.bubble .who{font-family:var(--pixel);font-size:9px;color:#7a3a10;margin-bottom:8px}
.bubble .say{font-size:18px;line-height:1.5;min-height:54px}
.gfoot{display:flex;gap:10px;max-width:448px;width:calc(100% - 32px);margin:18px auto calc(18px + env(safe-area-inset-bottom,0px))}
.gfoot .pbtn{flex:1}

/* ---------- главный экран ---------- */
.scene{position:relative;height:420px;margin:0 -16px;overflow:hidden;border-bottom:3px solid #000}
.scene .stage{width:600px;height:600px;top:42%}
.scene .shade{position:absolute;inset:0;background:linear-gradient(#0b143055,#0b143022 30%,#0b143088 62%,#0b1430 100%)}
.scene .cam>img{filter:brightness(.7) saturate(1.1)}
.scene .hero{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer}
.counter{position:absolute;left:0;right:0;top:14px;text-align:center;z-index:6}
.counter .n{font-family:var(--pixel);font-size:44px;color:var(--gold-hi);text-shadow:3px 3px 0 #6b3a10,0 0 18px #ffb85a;line-height:1}
.counter .n.neg{color:#ffd0cb;text-shadow:3px 3px 0 #5a1010}
.counter .k{font-family:var(--pixel);font-size:9px;color:var(--gold);margin-top:10px;text-shadow:2px 2px 0 #000;letter-spacing:1px}
.counter .p{font-size:15px;margin-top:8px;color:#e6ecff;text-shadow:1px 1px 0 #000}
.timers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.timer{background:#0d1640;border:2px solid #26346f;padding:10px}
.timer .v{font-family:var(--pixel);font-size:12px;color:var(--gold-hi);margin-bottom:6px;line-height:1.5}
.timer .k{font-size:13px;color:var(--muted);line-height:1.35}
.timer.hot{border-color:var(--trap)}
.status{border-left:4px solid #c46bd6;background:#24123a;padding:10px 12px;margin-top:10px}
.status.ceil{border-color:var(--gold);background:#2c2410}
.status.trap{border-color:var(--trap);background:#33130f}
.status.world{border-color:#5fb4ff;background:#0f1d44}
.captive .fogc{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at 50% 80%,#7b2d9a66,#2a0b33cc 70%);animation:pulse 4s ease-in-out infinite;pointer-events:none}
.chains{position:absolute;inset:10% -4% 6%;width:108%;height:84%;z-index:5;pointer-events:none;animation:clink 3s ease-in-out infinite}
@keyframes clink{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.captive .hero{z-index:5}.captive .hero .hsprite{filter:saturate(.45) brightness(.85)}
.say-line{font-style:italic;color:#e6ecff;margin:12px 0 0;text-align:center}

/* ---------- задания ---------- */
.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--navy);border:2px solid var(--navy-2);padding:12px 14px;margin-bottom:8px}
.task .t{font-weight:700}
.task .d{font-size:14px;color:var(--muted)}
.task .st{font-size:13px;margin-top:4px}
.st.ok{color:var(--ok)}.st.wait{color:var(--gold)}
.task.done{border-color:#2f6b45}
.days{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.days button{width:38px;height:38px;border:2px solid var(--navy-2);background:var(--night);cursor:pointer;font-size:13px}
.days button[aria-pressed="true"]{background:var(--gold);color:#1d1400;border-color:var(--gold)}
.days button:disabled{opacity:.6;cursor:default}

/* ---------- клан ---------- */
.mates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mate{background:#0d1640;border:2px solid #26346f;padding:8px 4px;text-align:center;font-size:14px}
.mate svg{width:56px;height:75px;display:block;margin:0 auto 4px}
.mate .c{color:var(--muted);font-size:12px}
.mate .f{font-size:12px;margin-top:4px}
.mate.me{border-color:var(--gold)}

/* ---------- вопросы ---------- */
.search{width:100%;padding:12px;background:var(--navy);border:2px solid var(--navy-2);margin:6px 0 10px}
.faq details{background:var(--navy);border:2px solid var(--navy-2);margin-bottom:8px}
.faq summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--gold)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 14px 12px;color:#dfe5ff}
mark{background:var(--gold);color:#1a1200}

/* ---------- куратор ---------- */
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input.t,select.t,textarea.t{padding:9px 10px;background:var(--night);border:2px solid var(--navy-2);width:100%}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px}
.subtabs button{flex:none;background:var(--navy);border:2px solid var(--navy-2);padding:8px 12px;cursor:pointer;font-size:14px}
.subtabs button[aria-current="true"]{border-color:var(--gold);color:var(--gold)}
.entry{background:var(--navy);border:2px solid var(--navy-2);border-left:6px solid var(--pc);padding:10px 12px;margin-bottom:8px}
.entry .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.entry .hd b{font-size:18px}
.entry .sum{font-family:var(--pixel);font-size:11px}
.claims{font-size:14px;color:var(--gold);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tog{border:2px solid var(--navy-2);background:var(--night);padding:6px 10px;cursor:pointer;font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--gold);background:#3a2f10;color:#ffe9b0}
.tog.bad[aria-pressed="true"]{border-color:var(--trap);background:#3d1513;color:#ffd0cb}
.event{border-left:4px solid var(--gold);padding:8px 12px;background:var(--navy);margin-bottom:8px}
.event.done{opacity:.5}
.mapbox{position:relative;margin:0 -16px}
.mapbox svg{display:block;width:100%;height:auto}
.maphint{position:sticky;top:56px;z-index:5;background:linear-gradient(#0b1430,#0b1430ee 70%,transparent);padding:10px 0 18px;font-size:14px;color:var(--muted)}
.mapjump{position:fixed;right:14px;bottom:30px;z-index:15}
.node,.tok{cursor:pointer}
.stepcard{border:3px solid var(--gold);background:linear-gradient(#18275e,#0e173a);padding:22px 18px;text-align:center}
.stepcard .lbl{font-family:var(--pixel);font-size:9px;color:var(--gold)}
.stepcard .ttl{font-family:var(--pixel);font-size:14px;line-height:1.6;margin:14px 0}
.stepcard .q{font-size:22px;font-style:italic;line-height:1.4;margin:6px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--navy);border:2px solid var(--navy-2);padding:12px}
.stat .v{font-family:var(--pixel);font-size:15px;color:var(--gold);margin-bottom:8px}
.stat .k{font-size:14px;color:var(--muted)}
.triples{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.triple{background:var(--navy);border:2px solid var(--navy-2);padding:12px}
.triple .t{font-family:var(--pixel);font-size:10px;color:var(--tc);margin-bottom:8px}
.triple .m{font-size:14px;color:var(--muted)}
.herohead{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:start}.herohead img{width:100px;display:block}.herohead .nm{font-family:var(--pixel);font-size:12px;line-height:1.6;margin:2px 0 8px}
.code{font-size:13px;color:var(--muted);word-break:break-all}

/* ---------- общее ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);width:max-content;background:var(--parch);color:#1d1400;padding:10px 16px;z-index:140;max-width:90%;box-shadow:0 0 0 3px #1d1400,0 4px 0 3px #0006;font-size:16px}
dialog{background:var(--navy);color:var(--parch);border:3px solid var(--gold);padding:18px;max-width:460px;width:92%}
dialog::backdrop{background:#000b}
.foot{margin-top:30px;text-align:center}
.greet{border:3px solid var(--gold);background:linear-gradient(#1c2a62,#111b45);padding:16px;margin:4px 0 14px}
.greet .hi{font-family:var(--pixel);font-size:11px;line-height:1.7;color:var(--gold)}
.greet .q{font-size:19px;font-style:italic;line-height:1.4;margin:10px 0 12px}
.diary textarea,.greet textarea,dialog textarea{width:100%;min-height:120px;padding:12px;background:var(--night);border:2px solid var(--navy-2);resize:vertical;line-height:1.5}
.entryd{border-left:3px solid var(--gold-dim);padding:6px 0 6px 12px;margin-bottom:14px}
.entryd .when{font-size:13px;color:var(--muted)}
.entryd .qq{font-size:14px;color:var(--gold);font-style:italic}
.entryd .tx{white-space:pre-wrap}
.lock{font-size:14px;color:var(--muted)}
.sndrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #26346f}
.switch{width:58px;height:32px;background:#26346f;border:2px solid #000;position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#a9b3d6;transition:left .15s}
.switch[aria-checked="true"]{background:#2f6b45}
.switch[aria-checked="true"]::after{left:29px;background:var(--gold-hi)}
.landing{text-align:center;padding-top:30px}
.landing .big{font-family:var(--pixel);font-size:13px;line-height:1.8;color:var(--gold-hi);margin:20px 0}
/* ---------- итоги встречи ---------- */
#recap{position:fixed;inset:0;z-index:85;background:#050817;overflow-y:auto}
#recap .bg{position:fixed;inset:0;overflow:hidden;opacity:.35}
.rc-in{position:relative;max-width:460px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column}
.rc-h{font-family:var(--pixel);font-size:14px;line-height:1.8;color:var(--gold-hi);text-align:center;text-shadow:2px 2px 0 #000}
.rc-h span{font-size:9px;color:var(--muted)}
.rc-cnt{text-align:center;margin:16px 0 6px}
.rc-cnt .n{font-family:var(--pixel);font-size:54px;color:var(--gold-hi);text-shadow:3px 3px 0 #6b3a10,0 0 22px #ffb85a;line-height:1}
.rc-cnt .n.burn{animation:burn 1s ease-out forwards}
@keyframes burn{0%{color:#fff;text-shadow:0 0 30px #ff7a4d,0 0 60px #ffd34d;transform:scale(1.25)}100%{color:#ffb85a55;text-shadow:none;transform:scale(1)}}
.rc-cnt .k{font-family:var(--pixel);font-size:9px;color:var(--gold);margin-top:12px;line-height:1.7}
.rc-road{position:relative;height:150px;margin:6px -16px 4px;overflow:hidden}
.rc-plates{position:absolute;left:-44px;right:-44px;bottom:6px;height:22px;display:flex;gap:4px;transition:transform .12s steps(2)}
.rc-plates i{flex:0 0 40px;height:22px;background:linear-gradient(#ffe08a,#b8893a);box-shadow:inset 0 0 0 3px #6b4f17,0 0 14px #ffd27a88}
.rc-hero{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
.rc-hero.hop{animation:rchop .2s ease-out}
@keyframes rchop{50%{transform:translate(-50%,-10px)}}
.rc-hero.cap{filter:saturate(.4) brightness(.8) drop-shadow(0 0 10px #b46bff)}
.rc-lines{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.rc-line{display:flex;gap:12px;align-items:flex-start;background:#0d1640ee;border:2px solid #26346f;padding:10px 12px;font-size:17px;animation:stepin .4s ease-out both}
.rc-line span{font-family:var(--pixel);font-size:12px;color:var(--gold);min-width:16px;padding-top:3px}
.rc-line.good{border-color:#2f6b45}.rc-line.good span{color:var(--ok)}
.rc-line.bad{border-color:#6b2a4a;background:#24123aee}.rc-line.bad span{color:#e7b6f2}
.rc-line.gold{border-color:var(--gold);background:#2c2410ee}
.rc-line.dark{border-color:#3a1f6e}.rc-line.dark span{color:#b46bff}
.rc-go{margin-top:auto;opacity:0;pointer-events:none;transition:opacity .5s}
.rc-go.show{opacity:1;pointer-events:auto}
.spark{position:fixed;z-index:200;width:6px;height:6px;pointer-events:none;animation:spark2 1.2s ease-out forwards}
@keyframes spark2{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 40px));opacity:0}}
.mvp{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:4;font-family:var(--pixel);font-size:8px;color:#1d1400;background:var(--gold);padding:5px 8px;box-shadow:0 0 0 2px #6b4f17,0 0 14px #ffd27a;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.scroll .tx p{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="splash" aria-label="ГНУ. Путь героя — загрузка"></div>
<div id="onb" class="hidden"></div>
<div id="greet" class="hidden"></div>
<header class="top" id="top">
  <div class="logo">ГНУ<small>ПУТЬ ГЕРОЯ</small></div>
  <div class="hright">
    <div><div class="weekbadge" id="weekbadge"></div><div class="sync" id="sync"></div></div>
    <button class="iconbtn" id="sndbtn" aria-label="Звук" onclick="soundDlg()"></button>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<nav class="tabs" id="nav" aria-label="Разделы"><div class="in" id="tabs"></div></nav>

const SPHERE_CELLS=[];
for(let n=5;n<=TOP;n+=5){ if(!MIRRORS.includes(n)&&!CEILINGS.includes(n)&&n!==TOP&&!TRAPS[n]&&!BRIDGES[n]&&!CONFIG.CHEST_CELLS.includes(n)) SPHERE_CELLS.push(n); }
function sphereOf(n){ const i=SPHERE_CELLS.indexOf(n); return i<0?null:CONFIG.SPHERE_ORDER[i%CONFIG.SPHERE_ORDER.length]; }
function worldOf(n){ return n<=0?'Старт':n<=40?'Тьма':n<=80?'Рассвет':'Золото'; }
function cellInfo(n){
  if(n===TOP) return {type:'top',title:'Вершина',text:'Дошедший остаётся здесь до конца потока. Лишние ходы сгорают.'};
  if(CEILINGS.includes(n)) return {type:'ceiling',title:'Потолок',text:'Герой обязательно останавливается, называет перед группой ограничение, которое сломал, и проходит испытание Стража порогов. Пробитый потолок — контрольная точка.'};
  if(TRAPS[n]) return {type:'trap',title:'Ловушка «'+TRAPS[n].name+'»',text:'Ведёт назад на клетку '+TRAPS[n].to+'. Можно не падать: взять у группы вызов и выполнить его до следующей встречи.'};
  if(BRIDGES[n]) return {type:'bridge',title:'Мост «'+BRIDGES[n].name+'»',text:'Ведёт вперёд на клетку '+BRIDGES[n].to+', если за неделю герой '+BRIDGES[n].cond+'. Подтверждает группа.'};
  if(MIRRORS.includes(n)) return {type:'mirror',title:'Зеркало',text:'Каждый участник группы говорит герою одну честную фразу о нём.'};
  if(CONFIG.CHEST_CELLS.includes(n)) return {type:'chest',title:'Сундук',text:'Герой тянет карту «Сундук» и сразу её разыгрывает: награда или испытание.'};
  const s=sphereOf(n); if(s) return {type:'sphere',sphere:s,title:'Клетка сферы «'+SPHERES[s].name+'»',text:'Герой тянет карту из колоды этой сферы и выполняет вызов до следующей встречи. +2 хода, в сфере своего класса +4.'};
  return {type:'plain',title:'Обычная клетка',text:'Ничего не происходит.'};
}

/* ---------- время: встречи по Новосибирску ---------- */
const HOUR=3600000, DAY=24*HOUR, WEEK=7*DAY;
function nextMeeting(now=Date.now()){
  if(S.nextMeeting){ const t=Date.parse(S.nextMeeting); if(t&&t>now-3*HOUR) return t; }
  const first=Date.parse(CONFIG.FIRST_MEETING);
  if(now<=first+3*HOUR) return first;
  const k=Math.ceil((now-first-3*HOUR)/WEEK);
  return first+k*WEEK;
}
function reflDeadline(now=Date.now()){ return nextMeeting(now)-12*HOUR; } // вторник 22:00 перед встречей
function tzDate(t){ return new Date(t+CONFIG.TZ_HOURS*HOUR); } // поля UTC = местное время Новосибирска
function untilText(ms){
  if(ms<=0) return 'сейчас';
  const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/HOUR), m=Math.floor(ms%HOUR/60000);
  if(d>0) return `${d} ${plural(d,'день','дня','дней')} ${h} ч`;
  if(h>0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}
function fmtMeeting(t){ const d=tzDate(t); const wd=['вс','пн','вт','ср','чт','пт','сб'][d.getUTCDay()]; return `${wd}, ${d.getUTCDate()}.${String(d.getUTCMonth()+1).padStart(2,'0')} в ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; }

/* ---------- загрузка ---------- */
async function load(){
  if(DEMO){
    try{ const raw=localStorage.getItem('gnu_state'); if(raw) S=Object.assign(freshState(),JSON.parse(raw)); }catch(e){}
    CLAIMS=lsGet('gnu_claims',{}); PROFILES=lsGet('gnu_profiles',{}); FAQ=lsGet('gnu_faq',null);
    S.heroes.forEach(h=>h.look=pickLook(PROFILES[h.id]));
    const h=MYCODE&&S.heroes.find(x=>x.code===MYCODE); ME=h?h.id:null;
    PROFILE=ME?(PROFILES[ME]||null):null;
    setSync('Демо-режим'); afterLoad(); return;
  }
  setSync('Загружаю…');
  try{
    let d;
    if(isCurator) d=await api({action:'state',pin});
    else { const r=await fetch(CONFIG.API_URL+'?action=state'+(MYCODE?'&code='+encodeURIComponent(MYCODE):''),{cache:'no-store'}); d=await r.json(); }
    if(d.ok){
      if(d.state) S=Object.assign(freshState(),d.state);
      CLAIMS=d.claims||{};
      if(d.profiles){ PROFILES=d.profiles; S.heroes.forEach(h=>h.look=pickLook(PROFILES[h.id])); }
      if(d.faq) FAQ=d.faq;
      ME=d.me||null;
      PROFILE=d.profile||null;
      if(isCurator&&!d.full){ isCurator=false; pin=''; sessionStorage.removeItem('gnu_pin'); }
    }
    setSync('');
  }catch(e){ setSync('Нет связи с таблицей'); }
  afterLoad();
}

  if(MYCODE&&ME){ localStorage.setItem('gnu_code',MYCODE); if(location.search) history.replaceState(null,'',location.pathname); }
  if(!tab) tab=isCurator?'cur':'hero';
  render();
  if(firstLoad){ firstLoad=false; dataReady=true; startFlow(); }
}
let saveTimer=null;
function stripLooks(st){ const c=JSON.parse(JSON.stringify(st)); (c.heroes||[]).forEach(h=>delete h.look); return c; }
function save(soon){
  S.updated=Date.now();
  if(DEMO){ try{ localStorage.setItem('gnu_state',JSON.stringify(stripLooks(S))); }catch(e){} return; }
  clearTimeout(saveTimer);
  if(soon){ saveTimer=setTimeout(()=>save(false),1200); return; }
  setSync('Сохраняю…');
  api({action:'save',pin,state:stripLooks(S)}).then(d=>{
    if(d.ok){ setSync('Сохранено'); setTimeout(()=>setSync(''),1500); } else { setSync(''); toast(d.error||'Не сохранилось'); }
  }).catch(()=>setSync('Не сохранилось: нет связи'));
}

/* ---------- анкета героя ---------- */
async function saveProfile(p){
  p.at=new Date().toISOString();
  PROFILE=p; PROFILES[ME]=p; const h=H(ME); if(h) h.look=pickLook(p);
  if(DEMO){ lsSet('gnu_profiles',PROFILES); return true; }
  try{ const d=await api({action:'profile',code:MYCODE,profile:p}); if(!d.ok){ toast(d.error||'Анкета не сохранилась'); return false; } return true; }
  catch(e){ toast('Нет связи: анкета сохранится, когда появится интернет'); lsSet('gnu_profile_pending',p); return false; }
}
function retryPendingProfile(){
  const p=lsGet('gnu_profile_pending',null); if(!p||DEMO||!MYCODE) return;
  api({action:'profile',code:MYCODE,profile:p}).then(d=>{ if(d.ok) localStorage.removeItem('gnu_profile_pending'); }).catch(()=>{});
}

/* =====================================================================
   ЗАЯВКИ УЧАСТНИКА
   ===================================================================== */
function myClaim(){ return CLAIMS[ME]||(CLAIMS[ME]={week:S.week,task:false,refl:false,min:[0,0,0,0,0,0,0],sphere:false,trap:false}); }
function claimOf(h){ const c=CLAIMS[h.id]; return c&&c.week===S.week?c:null; }
let claimTimer=null;
function setClaim(key,val){
  const c=myClaim(); if(c.week!==S.week){ CLAIMS[ME]={week:S.week,task:false,refl:false,min:[0,0,0,0,0,0,0],sphere:false,trap:false}; }
  const cc=myClaim();
  if(key==='min') cc.min[val]=cc.min[val]?0:1; else cc[key]=!cc[key];
  render();
  if(DEMO){ localStorage.setItem('gnu_claims',JSON.stringify(CLAIMS)); return; }
  clearTimeout(claimTimer);
  claimTimer=setTimeout(()=>{
    setSync('Отправляю…');
    api({action:'claim',code:MYCODE,claim:myClaim()}).then(d=>{ setSync(d.ok?'Отправлено куратору':''); if(!d.ok) toast(d.error||'Не отправилось'); setTimeout(()=>setSync(''),1800); })
      .catch(()=>setSync('Нет связи, попробуй ещё раз'));
  },900);
}

/* =====================================================================
   ИГРОВАЯ ЛОГИКА (куратор)
   ===================================================================== */
function D(h){ return S.draft[h.id]||(S.draft[h.id]={task:false,refl:'',present:false,minimum:false,sphere:'',trapDone:false,adjust:0}); }
function floorOf(h){ return Math.max(0,...(h.broken||[])); }
function ev(text,extra){ S.events.push(Object.assign({id:Math.random().toString(36).slice(2,8),text,done:false},extra||{})); }
function snapshot(){ const c=JSON.parse(JSON.stringify(S)); c.prev=null; S.prev=JSON.stringify(c); }
function tripleMembers(t){ return S.heroes.filter(h=>h.triple===t); }
function tripleOnTime(t){ const m=tripleMembers(t); return m.length>0&&m.every(h=>D(h).refl==='ontime'); }

function calcDelta(h){
  const d=D(h), parts=[];
  if(d.task) parts.push(['Задание потока',5]);
  if(d.refl==='ontime') parts.push(['Рефлексия вовремя',2]);
  if(d.refl==='none') parts.push(['Рефлексия не сдана',-10]);
  if(d.present) parts.push(['Встреча',1]);
  if(d.minimum) parts.push(['Минимум дня',2]);
  if(d.sphere){ const own=d.sphere===CLASSES[h.cls]?.sphere; parts.push([own?'Вызов своей сферы':'Вызов сферы',own?4:2]); }
  if(h.triple&&tripleOnTime(h.triple)) parts.push(['Вся тройка вовремя',1]);
  if(S.draft._mvp===h.id) parts.push(['Самый ценный',3]);
  if(d.refl==='ontime'&&((h.streak||0)+1)%4===0) parts.push(['4 рефлексии подряд',3]);
  if(d.adjust) parts.push(['Поправка / сила тройки',Number(d.adjust)]);
  if(h.carry&&!h.atCeiling&&!h.captured) parts.push(['Перенос с потолка',h.carry]);
  return {total:parts.reduce((a,p)=>a+p[1],0),parts};
}
function moveBy(h,n){
  if(!n) return;
  let target;
  if(n>0){
    target=h.pos+n;
    for(const c of CEILINGS){ if(h.pos<c&&target>=c&&!(h.broken||[]).includes(c)){ h.carry=(h.carry||0)+(target-c); target=c; h.atCeiling=c; break; } }
    target=Math.min(target,TOP);
  } else target=Math.max(h.pos+n,floorOf(h));
  h.pos=target;
  if(h.atCeiling&&h.atCeiling===target&&h.wk) h.wk.ceil=target;
  if(h.atCeiling&&h.atCeiling===target){ ev(`${h.name} у потолка ${target}: пробой и испытание Стража порогов. Лишние ходы переносятся.`,{type:'ceiling',hero:h.id}); return; }
  land(h);
}
function land(h){
  const n=h.pos;
  if(n===TOP){ ev(`${h.name} на вершине!`); return; }
  if(TRAPS[n]){
    if(S.effects.fireNoTraps&&h.triple==='fire'){ ev(`${h.name} проходит ловушку «${TRAPS[n].name}»: сила Огня`); return; }
    h.trap={cell:n,to:TRAPS[n].to,left:h.triple==='earth'?2:1}; if(h.wk) h.wk.trapNew=true;
    ev(`${h.name} в ловушке «${TRAPS[n].name}» (${n}). Берёт у группы вызов; не выполнит — спустится на ${TRAPS[n].to}.`); return;
  }
  if(BRIDGES[n]){ const b=BRIDGES[n]; ev(`${h.name} на мосту «${b.name}» ${n} → ${b.to}. Условие: ${b.cond}.`,{type:'bridge',hero:h.id,from:n,to:b.to}); return; }
  if(MIRRORS.includes(n)){ ev(`${h.name} на Зеркале (${n}): каждый говорит одну честную фразу.`); return; }
  if(CONFIG.CHEST_CELLS.includes(n)){ ev(`${h.name} на Сундуке (${n}): тянет карту и сразу разыгрывает.`); return; }
  const s=sphereOf(n);
  if(s){ h.sphereTask=s; if(h.wk) h.wk.sphere=true; ev(`${h.name} на клетке сферы «${SPHERES[s].name}» (${n}): тянет карту и выполняет вызов до следующей встречи${h.triple==='air'?' (Воздух: можно выбрать любую колоду)':''}.`); }
}
function moveHeroes(){
  const miss=S.heroes.filter(h=>!D(h).refl).map(h=>h.name);
  if(miss.length) return toast('Отметь рефлексию: '+miss.join(', '));
  snapshot(); S.events=[]; S.turn=(S.turn||0)+1; S.dark.from=S.dark.pos;
  const deltas=S.heroes.map(h=>[h,calcDelta(h)]);
  for(const [h,{total,parts}] of deltas){
    const d=D(h); h.from=h.pos; const from=h.pos;
    h.wk={world:worldOf(h.pos),wasCaptured:!!h.captured};
    const cs=CLASSES[h.cls]?.sphere; h.wheel=h.wheel||{};
    if(d.minimum&&cs) h.wheel[cs]=(h.wheel[cs]||0)+1;
    if(d.sphere) h.wheel[d.sphere]=(h.wheel[d.sphere]||0)+1;
    h.sphereTask=null;
    h.streak=d.refl==='ontime'?(h.streak||0)+1:0;
    if(h.trap){
      if(d.trapDone){ ev(`${h.name}: вызов ловушки «${TRAPS[h.trap.cell].name}» выполнен, герой остаётся на месте.`); h.trap=null; h.wk.trapSaved=true; }
      else{ h.trap.left--; if(h.trap.left<=0){ h.pos=Math.max(h.trap.to,floorOf(h)); h.wk.trapFell=true; ev(`${h.name}: вызов ловушки не выполнен, спуск на клетку ${h.pos}.`); h.trap=null; } else ev(`${h.name}: у Земли ещё неделя на вызов ловушки.`); }
    }
    if(h.captured){ h.held=(h.held||0)+total; ev(`${h.name} в плену, ходы копятся: ${h.held}.`); }
    else if(h.atCeiling){ h.carry=(h.carry||0)+total; ev(`${h.name} ждёт пробоя потолка ${h.atCeiling}, ходы копятся: ${h.carry}.`); }
    else { h.carry=0; moveBy(h,total); }
    h.last=total;
    S.log.push({week:S.week,hero:h.id,delta:total,from,to:h.pos,parts});
  }
  S.phase='resolve'; save(); render();
}
function resolveBridge(id,yes){
  const e=S.events.find(x=>x.id===id); if(!e) return;
  const h=H(e.hero); e.done=true;
  if(yes&&h&&h.pos===e.from){ h.pos=e.to; if(h.wk) h.wk.bridge=true; ev(`${h.name} проходит мост на ${e.to}.${h.triple==='fire'?' Огонь: ещё +3.':''}`); if(h.triple==='fire') moveBy(h,3); }
  save(); render();
}
function breakCeiling(id){
  const h=H(id); if(!h||!h.atCeiling) return;
  h.broken=[...(h.broken||[]),h.atCeiling]; h.wk=h.wk||{}; h.wk.broke=h.broken.length;
  ev(`${h.name}: потолок ${h.atCeiling} пробит. Перенос ходов: ${h.carry||0}, добавятся на следующей встрече.`);
  S.events.filter(e=>e.type==='ceiling'&&e.hero===h.id).forEach(e=>e.done=true);
  h.atCeiling=0; save(); render();
}
function darkMove(){
  if(S.events.some(e=>e.type==='bridge'&&!e.done)&&!confirm('Есть неподтверждённые мосты. Всё равно сделать ход Тьмы?')) return;
  snapshot();
  let steps=0; const why=[];
  const missed=S.heroes.filter(h=>D(h).refl==='none').length, absent=S.heroes.filter(h=>!D(h).present).length;
  if(S.week===9) why.push('неделя «Награда»: Тьма отдыхает');
  else if(S.effects.lanternStop) why.push('фонарь Наставника остановил Тьму');
  else{ steps=7+S.dark.bonus+missed+absent; why.push(`7${S.dark.bonus?' + '+S.dark.bonus+' настройка':''} + ${missed} за рефлексии + ${absent} за пропуски`); }
  S.dark.pos=Math.min(TOP,S.dark.pos+steps);
  const caught=[], caughtIds=[];
  for(const h of S.heroes){
    if(h.captured||h.pos>=TOP||h.pos>S.dark.pos) continue;
    if(S.effects.earthNoCapture&&h.triple==='earth') continue;
    h.captured=true; h.held=0; caught.push(h.name); caughtIds.push(h.id);
  }
  let faster=false;
  if(steps>0){ if(caught.length) S.dark.quiet=0; else { S.dark.quiet++; if(S.dark.quiet>=2){ S.dark.bonus++; S.dark.quiet=0; faster=true; why.push('Тьма усилилась: +1 к ходу'); } } }
  prepareRecap(steps,why,caughtIds,faster);
  S.lastDark={week:S.week,steps,why,caught,pos:S.dark.pos};
  S.log.push({week:S.week,dark:true,steps,caught,pos:S.dark.pos});
  if(S.week>=12) S.finished=true; else S.week++;
  S.effects={}; S.draft={}; S.phase='entry';
  save(); render();
  toast(caught.length?`Тьма прошла ${steps} и взяла в плен: ${caught.join(', ')}`:`Тьма прошла ${steps}. Никто не пойман.`);
}
/* итоги встречи для каждого героя: готовятся при «Ход Тьмы», участник видит их при следующем входе */
function prepareRecap(steps,why,caughtIds,faster){
  const mvp=S.draft._mvp||'';
  S.lastMvp=mvp;
  S.recapDark={turn:S.turn,week:S.week,steps,stop:steps?'':(why[0]||''),caught:caughtIds,faster,mvp};
  S.recap={};
  S.heroes.forEach(h=>{
    const w=h.wk||{};
    S.recap[h.id]={turn:S.turn,week:S.week,moves:h.last||0,from:h.from??h.pos,to:h.pos,
      captured:!!h.captured,newCaptured:caughtIds.includes(h.id),wasCaptured:!!w.wasCaptured,held:h.held||0,
      atCeiling:h.atCeiling||0,carry:h.carry||0,trap:!!h.trap,trapNew:!!w.trapNew,trapSaved:!!w.trapSaved,trapFell:!!w.trapFell,
      sphere:!!w.sphere,bridge:!!w.bridge,broke:w.broke||0,released:w.released||'',top:h.pos>=TOP,world:worldOf(h.pos),startWorld:w.world||''};
    delete h.wk;
  });
}
function release(id,how){
  const h=H(id); if(!h) return;
  if(how==='lantern'&&S.lanterns<=0) return toast('Фонарей не осталось');
  snapshot(); if(how==='lantern') S.lanterns--;
  h.captured=false; h.wk=h.wk||{}; h.wk.released=how;
  let p=Math.min(TOP,S.dark.pos+1);
  for(const c of CEILINGS){ if(!(h.broken||[]).includes(c)&&p>c&&h.pos<=c){ p=c; h.atCeiling=c; break; } }
  h.pos=Math.max(p,h.pos);
  const held=h.held||0; h.held=0;
  ev(`${h.name} на свободе (${how==='lantern'?'фонарь Наставника':'помогла тройка'}), клетка ${h.pos}.`);
  if(h.atCeiling) h.carry=(h.carry||0)+held; else moveBy(h,held);
  save(); render();
}
function undo(){
  if(!S.prev) return toast('Нечего отменять');
  if(!confirm('Отменить последнее действие (ход героев, ход Тьмы или освобождение)?')) return;
  S=Object.assign(freshState(),JSON.parse(S.prev)); save(); render();
}
function usePower(t){
  const st=S.triples[t]; if(st.used) return;
  if(!tripleOnTime(t)) return toast('Сила доступна, только если все трое сдали рефлексию вовремя');
  if(t==='water') return waterDialog();
  if((t==='fire'||t==='air')&&S.phase!=='entry') return toast('Эту силу применяют до движения героев');
  if(!confirm(`Применить силу тройки «${TRIPLES[t].name}»? Печать терпения для тройки будет потеряна.`)) return;
  st.used=true; st.week=S.week;
  if(t==='fire') S.effects.fireNoTraps=true;
  if(t==='earth') S.effects.earthNoCapture=true;
  if(t==='air') tripleMembers('air').forEach(h=>{ D(h).adjust=Number(D(h).adjust||0)+5; });
  save(); render(); toast('Сила применена');
}
function waterDialog(){
  if(S.phase!=='entry') return toast('Силу Воды применяют до движения героев');
  const opts=tripleMembers('water').map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');
  openDlg(`<h2>Сила Воды</h2><label class="f">Отдаёт</label><select class="t" id="wf">${opts}</select>
    <label class="f">Получает</label><select class="t" id="wt">${opts}</select>
    <label class="f">Сколько ходов</label><input class="t" id="wa" type="number" min="1" value="3">
    <div class="row" style="margin-top:14px"><button class="btn" id="wok">Применить силу</button><button class="btn ghost" onclick="closeDlg()">Отмена</button></div>`);
  $('#wok').onclick=()=>{
    const f=H($('#wf').value), t=H($('#wt').value), a=Math.max(1,parseInt($('#wa').value)||0);
    if(!f||!t||f===t) return toast('Выбери двух разных героев');
    D(f).adjust=Number(D(f).adjust||0)-a; D(t).adjust=Number(D(t).adjust||0)+a;
    S.triples.water.used=true; S.triples.water.week=S.week; closeDlg(); save(); render(); toast('Сила Воды применена');
  };
}

const SND={cfg:Object.assign({voice:true,sfx:true,music:false},lsGet('gnu_snd',{})),ctx:null,music:null,unlocked:false};
function actx(){
  if(!SND.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SND.ctx=new C(); }
  if(SND.ctx.state==='suspended') SND.ctx.resume();
  return SND.ctx;
}
function tone(freq,dur,o={}){
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.at||0), osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'square'; osc.frequency.setValueAtTime(freq,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  const v=o.vol??.06; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.setValueAtTime(v,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t+dur+.02);
}
function noise(dur,o={}){
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.at||0), n=c.createBufferSource(), b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=o.f||900; f.Q.value=1.2;
  const g=c.createGain(); g.gain.value=o.vol||.18; n.buffer=b; n.connect(f).connect(g).connect(c.destination); n.start(t);
}
const SFX={
  click(){ tone(660,.04,{vol:.04}); },
  check(){ tone(660,.07); tone(990,.12,{at:.07}); },
  coin(){ tone(988,.07,{vol:.05}); tone(1319,.22,{at:.07,vol:.05}); },
  task(){ [523,659,784,1047].forEach((f,i)=>tone(f,.11,{at:i*.09,vol:.05})); },
  unlock(){ [392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,{at:i*.08,type:'triangle',vol:.09})); },
  bark(){ noise(.12,{f:700,vol:.25}); tone(520,.12,{slide:260,type:'sawtooth',vol:.05}); noise(.1,{f:800,vol:.2,at:.18}); tone(560,.1,{slide:280,type:'sawtooth',vol:.05,at:.18}); },
  step(){ tone(196,.06,{type:'triangle',vol:.08}); },
  portal(){ tone(180,1.6,{type:'sine',slide:1400,vol:.08}); tone(270,1.6,{type:'triangle',slide:2100,vol:.04}); },
  start(){ [262,330,392,523].forEach((f,i)=>tone(f,.16,{at:i*.12,type:'triangle',vol:.09})); },

function startMusic(){
  if(SND.music||!SND.cfg.music) return; const c=actx(); if(!c) return;
  const master=c.createGain(); master.gain.value=.0; master.connect(c.destination); master.gain.linearRampToValueAtTime(.035,c.currentTime+3);
  const pads=[110,164.8,220].map(f=>{ const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=c.createGain(); g.gain.value=.35; o.connect(g).connect(master); o.start(); return o; });

  const iv=setInterval(()=>{ const t=c.currentTime, o=c.createOscillator(), g=c.createGain(); o.type='square'; o.frequency.value=notes[i++%notes.length]/(i%16<8?1:2);

/* голос: сначала файл voice/КЛЮЧ.mp3, если его нет — синтез речи */
const VOICE={avail:{},audio:null};
function pickVoice(who){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang)); if(!vs.length) return null;
  const score=v=>{ let s=0; const n=v.name;
    if(/Google|Natural|Neural|Premium|Enhanced|Online/i.test(n)) s+=3;
    if(who==='egor'&&/Dmitr|Pavel|Yuri|Maxim|Ivan|Male|Муж|Дмитр|Юрий|Максим/i.test(n)) s+=5;
    if(who==='yara'&&/Milena|Svetlana|Irina|Ekaterina|Dariya|Female|Светлан|Ирин|Милен/i.test(n)) s+=2;
    if(v.localService) s+=1; return s; };
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
function stopVoice(){ try{ VOICE.audio&&VOICE.audio.pause(); }catch(e){} VOICE.audio=null; try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} }
function speak(key,text,who='egor'){
  return new Promise(res=>{
    stopVoice();
    if(!SND.cfg.voice) return res();
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    const tts=()=>{
      if(!('speechSynthesis' in window)) return fin();
      const u=new SpeechSynthesisUtterance(text.replace(/[«»()]/g,'').replace(/—/g,','));
      u.lang='ru-RU'; const v=pickVoice(who); if(v) u.voice=v;
      if(who==='yara'){ u.pitch=1.7; u.rate=1.1; } else { u.pitch=.92; u.rate=.98; }
      u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
      setTimeout(fin,2500+text.length*95);
    };
    if(VOICE.avail[key]===false) return tts();
    const a=new Audio(CONFIG.VOICE+key+'.mp3'); VOICE.audio=a; let failed=false;
    const fail=()=>{ if(failed) return; failed=true; VOICE.avail[key]=false; if(VOICE.audio===a) tts(); };
    a.onended=fin; a.onerror=fail;
    a.play().then(()=>{ VOICE.avail[key]=true; }).catch(fail);
  });
}

function unlockedSet(h){
  const set=new Set(); if(!h) return set;
  const st=bestStreak(h); if(st>=2) set.add('streak2'); if(st>=4) set.add('streak4'); if(st>=8) set.add('streak8');
  const br=(h.broken||[]).length; if(br>=1) set.add('ceil1'); if(br>=2) set.add('ceil2');
  const pc=personalDone(h); if(pc>=3) set.add('pers3'); if(pc>=6) set.add('pers6');
  if(h.pos>=TOP) set.add('top');
  return set;
}

function bestStreak(h){ let best=0,cur=0; S.log.filter(l=>l.hero===h.id).sort((a,b)=>a.week-b.week).forEach(l=>{ cur=weekClean(l)?cur+1:0; best=Math.max(best,cur); }); return best; }
function curStreak(h){ let cur=0; S.log.filter(l=>l.hero===h.id).sort((a,b)=>a.week-b.week).forEach(l=>{ cur=weekClean(l)?cur+1:0; }); return cur; }

function pendingFor(h){
  const c=claimOf(h); if(!c) return {sum:0,items:[]};
  const d=D(h), items=[];
  if(c.task&&!d.task) items.push(['Задание потока',5]);
  if(c.refl&&!d.refl) items.push(['Рефлексия',2]);
  const days=(c.min||[]).filter(Boolean).length;
  if(days>=5&&!d.minimum) items.push(['Минимум дня',2]);
  if(c.sphere&&h.sphereTask&&!d.sphere) items.push(['Вызов сферы',h.sphereTask===CLASSES[h.cls]?.sphere?4:2]);
  return {sum:items.reduce((a,i)=>a+i[1],0),items};
}
function chainsSVG(){
  const link=(x1,y1,x2,y2)=>{ let g=''; const n=9; for(let i=0;i<=n;i++){ const x=x1+(x2-x1)*i/n, y=y1+(y2-y1)*i/n, a=Math.atan2(y2-y1,x2-x1)*180/Math.PI+(i%2?90:0);
    g+=`<rect x="${(x-4).toFixed(1)}" y="${(y-2.6).toFixed(1)}" width="8" height="5.2" rx="2.4" fill="none" stroke="#1b1226" stroke-width="3" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/><rect x="${(x-4).toFixed(1)}" y="${(y-2.6).toFixed(1)}" width="8" height="5.2" rx="2.4" fill="none" stroke="#c9c2d6" stroke-width="1.6" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; } return g; };
  return `<svg class="chains" viewBox="0 0 100 110" aria-hidden="true">${link(6,30,94,88)}${link(94,30,6,88)}</svg>`;
}
function heroLine(h,total){
  const now=Date.now(), dl=reflDeadline(now), mt=nextMeeting(now), hr=tzDate(now).getUTCHours();
  const c=claimOf(h);
  if(h.captured) return 'Даже в плену ходы копятся. Тебя вытащат — ты здесь не один.';
  if(h.atCeiling) return 'Потолок — это не стена. Это дверь, которую ты ещё не открыл.';
  if(dl>now&&dl-now<30*HOUR&&!(c&&c.refl)) return `До 22:00 осталось ${Math.max(1,Math.round((dl-now)/HOUR))} ч. Твои мысли за неделю стоят двух ходов.`;
  if(mt>now&&mt-now<24*HOUR) return 'Что ждёт тебя на поле — узнаешь завтра. Главное — прийти с ходами.';
  if(total<7&&mt-now<3*DAY) return `Пока ${total} ${plural(total,'ход','хода','ходов')}. Тьма ходит на 7. Хватит ли?`;
  const st=curStreak(h); if(st>=4) return `${st} ${plural(st,'неделя','недели','недель')} подряд. Это уже характер.`;
  if(hr>=18&&!(c&&(c.task||c.refl||(c.min||[]).some(Boolean)))) return 'День ещё не закончен. Один маленький шаг — тоже шаг.';
  if(hr<12) return 'Новый день — новые ходы. С чего начнёшь?';
  return 'Я не дам тебе лёгкий путь. Я дам тебе путь, который сделает тебя сильнее.';
}

function wheelHtml(h){

  const pt=(i,r)=>{ const a=-Math.PI/2+i*Math.PI*2/6; return [cx+r*Math.cos(a),cy+r*Math.sin(a)]; };
  let g='';
  [0.33,0.66,1].forEach(f=>{ g+=`<polygon points="${keys.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#1b2c66" stroke-width="1.5"/>`; });
  const vals=keys.map((k,i)=>pt(i,R*Math.max(0.06,((h.wheel||{})[k]||0)/max)).join(',')).join(' ');

}

function rnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function vMap(){
  const R=rnd(7); let bg='', scen='', path='', nodes='', extra='';

  for(let i=0;i<140;i++){ const y=y40+R()*(MH-y40-30), x=R()*MW; if(!far(y,x)) continue; const s=10+R()*18;

  for(let i=0;i<46;i++){ const y=y80+30+R()*(y40-y80-40), x=R()*MW; if(!far(y,x)) continue; const s=26+R()*40;

  for(let i=0;i<60;i++){ const y=MTOP*0.6+R()*(y80-MTOP*0.6), x=R()*MW; if(!far(y,x)) continue;

  for(let i=0;i<60;i++){ const y=y40+R()*(MH-y40), x=R()*MW; scen+=`<rect x="${x}" y="${y}" width="2" height="2" fill="#9fb2ff" opacity="${.15+R()*.3}"/>`; }
  // замок на вершине

   <g transform="translate(${cx},${cy-34})" fill="#3a2a10">

        ${h.captured?`<text y="4" text-anchor="middle" font-size="12" fill="#fff">⛓</text>`:''}
        ${me?`<text y="${r+16}" text-anchor="middle" font-family="Press Start 2P" font-size="8" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">${esc(h.name)}</text>`:''}</g>`;
    });
  });

  const hint=me?`<b>${esc(me.name)}</b>: клетка ${me.pos}. ${me.captured?'Ты в плену.':`До Тьмы ${me.pos-S.dark.pos} ${plural(me.pos-S.dark.pos,'клетка','клетки','клеток')}.`} Карта обновляется после встречи.`

  return `<div class="maphint">${hint}</div><div class="mapbox"><svg viewBox="0 0 ${MW} ${MH}" role="img" aria-label="Карта пути героя">${bg}${scen}${path}${extra}${nodes}${fog}${toks}</svg></div>
   <button class="btn mapjump" onclick="scrollToMe(true)">${me?'Мой герой':'К Тьме'}</button>`;
}
function svgScale(){ const s=$('.mapbox svg'); return s?s.getBoundingClientRect().width/MW:1; }
function scrollToMe(smooth){
  const s=$('.mapbox svg'); if(!s) return;
  const h=H(ME), n=h?h.pos:S.dark.pos;
  const top=s.getBoundingClientRect().top+window.scrollY+ny(n)*svgScale()-window.innerHeight*0.55;
  window.scrollTo({top:Math.max(0,top),behavior:smooth?'smooth':'auto'});
}
function afterMap(){
  scrollToMe(false);
  const h=H(ME); if(!h) return;
  const seenKey='gnu_seen_'+h.id, seen=+localStorage.getItem(seenKey)||0;
  if(S.turn&&seen<S.turn&&h.from!=null&&h.from!==h.pos&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    localStorage.setItem(seenKey,S.turn);
    animateMe(h.from,h.pos);
  } else if(S.turn) localStorage.setItem(seenKey,S.turn);
}
function animateMe(from,to){
  const t=$('#metok'); if(!t) return;
  const dir=to>from?1:-1; let n=from;
  const place=k=>t.setAttribute('transform',`translate(${nx(k).toFixed(1)},${(ny(k)-6).toFixed(1)})`);
  place(n);
  setTimeout(()=>{
    const s=$('.mapbox svg'); const top=s.getBoundingClientRect().top+window.scrollY+ny(from)*svgScale()-window.innerHeight*0.55; window.scrollTo({top});
    const iv=setInterval(()=>{
      n+=dir; place(n);
      const y=s.getBoundingClientRect().top+window.scrollY+ny(n)*svgScale()-window.innerHeight*0.55;
      window.scrollTo({top:y});
      if(n===to){ clearInterval(iv); toast(to>from?`Ты прошёл ${to-from} ${plural(to-from,'клетку','клетки','клеток')} и стоишь на ${to}`:`Ты отступил на клетку ${to}`); }
    },220);
  },600);
}

function flip(id,key){ const d=D(H(id)); d[key]=!d[key]; save(true); render(); }
function claimText(h){
  const c=claimOf(h); if(!c) return '';
  const a=[]; const days=(c.min||[]).filter(Boolean).length;
  if(c.task) a.push('задание'); if(c.refl) a.push('рефлексия'); if(days) a.push(`минимум ${days}/7`);
  if(c.sphere&&h.sphereTask) a.push(`вызов сферы «${SPHERES[h.sphereTask].name}»`); if(c.trap&&h.trap) a.push('вызов ловушки');

}
function acceptClaims(id){
  const h=H(id), c=claimOf(h), d=D(h); if(!c) return;
  if(c.task) d.task=true;

  if((c.min||[]).filter(Boolean).length>=5) d.minimum=true;
  if(c.sphere&&h.sphereTask) d.sphere=h.sphereTask;
  if(c.trap&&h.trap) d.trapDone=true;
  save(true); render();
}

function dayQuestion(h){
  const sph=SPHERES[CLASSES[clsOf(h)]?.sphere]?.name||'своей сфере';
  const step=STEPS[S.week];
  const qs=[
    'Как ты сегодня? Что было главным за день?',
    `Что ты сегодня сделал для сферы «${sph}»?`,
    step?step.q:'Что сегодня получилось лучше, чем вчера?',
    'За что ты сегодня можешь себя поблагодарить?',
    'Какое слово ты сегодня сдержал?',
    'Что сегодня было трудно и как ты с этим справился?',
    'Какой маленький шаг ты сделаешь завтра?',
  ];
  const d=new Date(), n=Math.floor(d.getTime()/86400000);
  if(d.getDay()===1||d.getDay()===2) return 'Скоро рефлексия. Что важного случилось за эту неделю?';
  return qs[n%qs.length];
}

/* =====================================================================
   ИТОГИ ВСТРЕЧИ: счётчик сгорает шагами, потом — что случилось
   ===================================================================== */
const CEIL_ORD=['первый','второй'];
function recapPending(){ const r=S.recap&&S.recap[ME]; return !!r&&lsGet('gnu_recap_'+ME,0)<r.turn; }
function recapLines(){
  const r=S.recap[ME], dk=S.recapDark||{}, h=H(ME), lines=[];
  const add=(t,cls='',ic='✦')=>lines.push({t,cls,ic});
  const cells=r.to-r.from;
  if(r.wasCaptured&&r.captured) add(`Ты в плену. Ходы копятся: ${r.held}. Тебя вытащат — ты здесь не один.`,'bad','⛓');
  else if(cells>0) add(`Ты прошёл ${cells} ${plural(cells,'клетку','клетки','клеток')}.`,'good','➤');
  else if(cells<0) add(`Ты отступил на ${-cells} ${plural(-cells,'клетку','клетки','клеток')}.`,'bad','◀');
  else if(!r.atCeiling) add('Ты остался на месте.','','•');
  if(r.released) add(`Ты на свободе! ${r.released==='lantern'?'Наставник зажёг фонарь.':'Тройка вытащила тебя.'}`,'good','✧');
  if(r.bridge) add('Ты прошёл по мосту — короткий путь вперёд.','good','⌒');
  if(r.trapSaved) add('Вызов ловушки выполнен — ты устоял на месте.','good','✓');
  if(r.trapFell) add('Вызов ловушки не выполнен — пришлось спуститься.','bad','▼');
  if(r.trapNew&&r.trap) add('Ты попал в ловушку. Можно не падать: возьми у группы вызов, куратор добавит его в задания.','bad','!');
  if(r.sphere) add('Ты вытянул карту сферы. Вызов появится в заданиях.','','◆');
  if(r.broke) add(`Ты пробил ${CEIL_ORD[r.broke-1]||'новый'} потолок! Новый уровень. Ниже ты уже не упадёшь.`,'gold','★');
  else if(r.atCeiling) add('Ты у потолка. Остальные ходы перенесены на следующую встречу.','gold','▬');
  if(r.world!==r.startWorld&&r.world!=='Старт'&&r.startWorld) add(`Ты вошёл в мир «${r.world}».`,'gold','☼');
  if(r.top) add('Ты на вершине! Ты — герой потока.','gold','♛');
  if(dk.steps) add(`Тьма сделала ${dk.steps} ${plural(dk.steps,'шаг','шага','шагов')}.${dk.faster?' Она стала быстрее.':''}`,'dark','☾');
  else if(dk.stop) add(`Тьма стояла: ${dk.stop}.`,'good','☾');
  if(r.newCaptured) add('Ты в плену — тройка уже идёт на помощь.','bad','⛓');
  const mates=(dk.caught||[]).filter(id=>id!==ME&&tripleOf(H(id)||{})&&tripleOf(H(id))===tripleOf(h));
  mates.forEach(id=>add(`${firstName(H(id))} из твоей тройки в плену — помогите вытащить.`,'bad','⛓'));
  const others=(dk.caught||[]).filter(id=>id!==ME&&!mates.includes(id)).map(id=>H(id)).filter(Boolean);
  if(others.length) add(`Тьма догнала: ${others.map(firstName).join(', ')}.`,'dark','☾');
  if(!(dk.caught||[]).length&&dk.steps) add('Никого не догнала. Так держать.','good','✓');
  if(dk.mvp) add(dk.mvp===ME?'Самый ценный участник недели — ты! +3 хода и значок.':`Самый ценный участник недели — ${firstName(H(dk.mvp)||{name:'герой'})}.`,'gold','★');
  const st=curStreak(h); if(st>=2) add(st>=4?`${st} ${plural(st,'неделя','недели','недель')} подряд без пропусков. Это уже характер.`:`${st} недели подряд без пропусков.`,'gold','✦');
  return lines;
}
function showRecap(replay){
  const h=H(ME), r=S.recap&&S.recap[ME]; if(!h||!r) return;
  const start=(r.wasCaptured&&r.captured)?0:Math.max(-30,Math.min(60,r.moves));
  const ov=document.createElement('div'); ov.id='recap';
  ov.innerHTML=`<div class="bg">${stageHTML({stars:16})}</div>
   <div class="rc-in">
     <div class="rc-h">ИТОГИ ВСТРЕЧИ<br><span>неделя ${r.week}</span></div>
     <div class="rc-cnt"><div class="n" id="rcn">${sign(start)}</div><div class="k" id="rck">${start?'ходов в путь':'ходов'}</div></div>
     <div class="rc-road"><div class="rc-plates" id="rcp">${'<i></i>'.repeat(14)}</div><div class="rc-hero${r.captured?' cap':''}" id="rch">${heroBox(lookOfHero(h),{scale:4})}</div></div>
     <div class="rc-lines" id="rcl"></div>
     <button class="pbtn wide rc-go" id="rcgo" onclick="closeRecap(${replay?'true':'false'})">${replay?'Закрыть':'Открыть новую неделю'}</button>
   </div>`;
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const lines=recapLines();
  const showLines=()=>{
    const box=$('#rcl'); if(!box) return;
    if(r.broke||r.top) salute();
    lines.forEach((l,i)=>{ setTimeout(()=>{ if(!$('#rcl')) return; box.insertAdjacentHTML('beforeend',`<div class="rc-line ${l.cls}"><span>${l.ic}</span><div>${esc(l.t)}</div></div>`); sfx(l.cls==='gold'?'coin':l.cls==='bad'?'step':'click'); },reduceMotion()?0:i*420); });
    setTimeout(()=>{ $('#rcgo')?.classList.add('show'); },reduceMotion()?0:lines.length*420+200);
  };
  if(reduceMotion()||!start){ if(!start) $('#rck').textContent=r.captured?'ходы копятся в плену':'ходов'; setTimeout(showLines,400); return; }
  // счётчик сгорает: каждый шаг — минус один ход и шаг героя по плитам
  let n=start; const dir=start>0?-1:1, dt=Math.max(70,Math.min(220,2600/Math.abs(start)));
  setTimeout(()=>{
    const iv=setInterval(()=>{
      if(!$('#rcn')){ clearInterval(iv); return; }
      n+=dir; $('#rcn').textContent=sign(n);
      const hh=$('#rch'); hh.classList.remove('hop'); void hh.offsetWidth; hh.classList.add('hop');
      const pl=$('#rcp'); pl.style.transform=`translateX(${(pl._x=(pl._x||0)+(dir<0?-1:1)*22)%44}px)`;
      if(Math.abs(n)%2===0) sfx('step');
      if(n===0){ clearInterval(iv); $('#rcn').classList.add('burn'); $('#rck').textContent='счётчик сгорел — ты сделал ход'; buzz([30,40,30]); setTimeout(showLines,700); }
    },dt);
  },900);
}
function closeRecap(replay){
  const r=S.recap[ME]; if(!replay){ lsSet('gnu_recap_'+ME,r.turn); }
  $('#recap')?.remove(); document.body.style.overflow='';
  render();
  if(!replay){ toast('Новая неделя открыта. Задания уже ждут.'); sfx('task'); setTimeout(entryQueue,600); }
}

/* салют: пробитый потолок, вершина, новый предмет */
function salute(){
  if(reduceMotion()) return;
  const cols=['#ffe08a','#ff7a4d','#7fd0ff','#b46bff','#8fe3a2','#fff'];
  for(let b=0;b<4;b++) setTimeout(()=>{
    const x=15+Math.random()*70, y=12+Math.random()*30;
    for(let i=0;i<22;i++){ const a=i/22*Math.PI*2, d=60+Math.random()*60, el=document.createElement('i'); el.className='spark';
      el.style.cssText=`left:${x}vw;top:${y}vh;background:${cols[(b+i)%cols.length]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`; document.body.appendChild(el); setTimeout(()=>el.remove(),1300); }
    sfx('coin'); buzz(20);
  },b*380);
}

/* ---------- новые вещи гардероба ---------- */
function allGear(cls){ return [...CLOAKS.map(x=>['Плащ',x]),...(ATTRS[cls]||[]).map(x=>['Атрибут',x]),...AMULETS.map(x=>['Амулет',x]),...AURAS.map(x=>['Аура',x])]; }
function unlockBaseline(){ const h=H(ME); if(h) lsSet('gnu_unl_'+ME,[...unlockedSet(h)]); }
function newUnlocks(){
  const h=H(ME); if(!h) return [];
  const seen=lsGet('gnu_unl_'+ME,[]);
  const fresh=[...unlockedSet(h)].filter(k=>!seen.includes(k));
  return allGear(clsOf(h)).filter(([,x])=>x.lock&&fresh.includes(x.lock));
}
function showUnlocks(items,next){
  unlockBaseline(); salute(); sfx('unlock');
  openDlg(`<h2>Открыто новое снаряжение!</h2><p class="muted">За постоянство. Нажми на героя на главном экране, чтобы переодеться.</p>
    ${items.map(([cat,x])=>`<div class="panel" style="display:flex;gap:12px;align-items:center"><span style="font-size:22px">✦</span><div><b>${esc(x.name)}</b><div class="muted" style="font-size:14px">${cat} · ${esc(UNLOCKS[x.lock])}</div></div></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="pbtn small" onclick="closeDlg()">Отлично</button></div>`);
  $('#dlg').addEventListener('close',()=>next&&next(),{once:true});
}

/* ---------- гардероб после онбординга ---------- */
let WR=null;
function wardrobeDlg(){
  const h=H(ME); if(!h) return;
  WR={cls:clsOf(h),gear:Object.assign({},gearOf(h))}; sfx('click');
  openDlg(`<h2>Гардероб</h2><div class="wardrobe"><div id="wprev" style="display:grid;place-items:center;min-height:230px">${heroBox({cls:WR.cls,gear:WR.gear,seed:ME},{scale:7})}</div>
    <div class="cats">${[['cloak','Плащ'],['attr','Атрибут'],['amulet','Амулет'],['aura','Аура']].map(([k,l])=>`<button aria-current="${gearCat===k}" data-cat="${k}">${l}</button>`).join('')}</div>
    <div class="items" id="witems"></div><div class="itemname" id="wname"></div></div>
    <div class="row" style="margin-top:12px"><button class="pbtn small" onclick="wardrobeSave()">Надеть</button><button class="pbtn small dark" onclick="closeDlg()">Отмена</button></div>`);
  const unl=unlockedSet(h);
  const nameNow=()=>{ const it=gearList(gearCat,WR.cls).find(x=>x.id===WR.gear[gearCat]); $('#wname').textContent=it?it.name:''; };
  const draw=()=>{ $('#witems').innerHTML=gearItems(WR.cls,WR.gear,unl); document.querySelectorAll('#witems .item').forEach(b=>b.onclick=()=>{
    const it=gearList(gearCat,WR.cls).find(x=>x.id===b.dataset.id);
    if(b.dataset.lock){ sfx('click'); $('#wname').innerHTML=`<b>${esc(it.name)}</b><br>🔒 ${esc(UNLOCKS[b.dataset.lock])}`; return; }
    WR.gear[gearCat]=it.id; sfx('check'); document.querySelectorAll('#witems .item').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#wprev').innerHTML=heroBox({cls:WR.cls,gear:WR.gear,seed:ME},{scale:7}); nameNow(); }); nameNow(); };
  document.querySelectorAll('#dlg .cats button').forEach(b=>b.onclick=()=>{ gearCat=b.dataset.cat; sfx('click'); document.querySelectorAll('#dlg .cats button').forEach(x=>x.setAttribute('aria-current',x===b)); draw(); });
  draw();
}
async function wardrobeSave(){
  const h=H(ME); const p=Object.assign({name:nameOf(h),cls:clsOf(h),triple:tripleOf(h),scroll:{},onb:true},PROFILE||{},{gear:WR.gear});
  closeDlg(); await saveProfile(p); render(); sfx('unlock'); toast('Новый облик надет');
}

/* ---------- объявления куратора ---------- */
function activeAnnounce(){ return (S.announce||[]).filter(a=>Date.now()-Date.parse(a.at)<21*DAY).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at)); }
function unseenAnnounce(){ const seen=lsGet('gnu_ann_'+ME,[]); return activeAnnounce().filter(a=>!seen.includes(a.id)); }
function showAnnounce(next){
  const list=unseenAnnounce(); if(!list.length) return next&&next();
  lsSet('gnu_ann_'+ME,[...lsGet('gnu_ann_'+ME,[]),...list.map(a=>a.id)].slice(-60));
  sfx('task');
  openDlg(`<h2>Объявление куратора</h2>${list.map(a=>`<div class="panel gold"><div class="muted" style="font-size:13px">${esc(fmtDate(a.at))}</div><div style="white-space:pre-wrap">${esc(a.text)}</div></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="pbtn small" onclick="closeDlg()">Понятно</button></div>`);
  $('#dlg').addEventListener('close',()=>{ render(); next&&next(); },{once:true});
}
function announceBlock(){
  const list=activeAnnounce().slice(0,3); if(!list.length) return '';
  return `<h2>Объявления</h2>${list.map(a=>`<div class="panel gold"><div class="muted" style="font-size:13px">${esc(fmtDate(a.at))}</div><div style="white-space:pre-wrap">${esc(a.text)}</div></div>`).join('')}`;
}
function cAnnounce(){
  return `<p class="muted">Объявление участники увидят при следующем входе, а потом ещё три недели на главном экране.</p>
   <div class="panel gold"><textarea class="t" id="annt" rows="4" placeholder="Текст объявления"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn" onclick="addAnnounce()">Опубликовать</button></div></div>
   ${(S.announce||[]).slice().reverse().map(a=>`<div class="event"><div class="muted" style="font-size:13px">${esc(fmtDate(a.at))}</div><div style="white-space:pre-wrap">${esc(a.text)}</div>
     <button class="linkbtn" onclick="delAnnounce('${a.id}')">удалить</button></div>`).join('')||'<p class="muted">Объявлений пока нет.</p>'}`;
}
function addAnnounce(){ const t=$('#annt').value.trim(); if(!t) return toast('Напиши текст'); S.announce=S.announce||[]; S.announce.push({id:Math.random().toString(36).slice(2,9),text:t,at:new Date().toISOString()}); save(); render(); toast('Объявление опубликовано'); }
function delAnnounce(id){ if(!confirm('Удалить объявление?')) return; S.announce=(S.announce||[]).filter(a=>a.id!==id); save(); render(); }

/* ---------- диалог и старт ---------- */
function openDlg(html){ const d=$('#dlg'); d.innerHTML=html; d.showModal(); }
function closeDlg(){ $('#dlg').close(); }
$('#dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') closeDlg(); });
(function init(){
  drawSndBtn();
  buildSplash();
  const p=sessionStorage.getItem('gnu_pin'); if(p&&!DEMO){ pin=p; isCurator=true; }
  load();
  if(!DEMO) setInterval(()=>{ if(!isCurator&&document.visibilityState==='visible'&&['hero','tasks','clan'].includes(tab)&&!$('#dlg').open&&$('#onb').classList.contains('hidden')&&$('#greet').classList.contains('hidden')) load(); },60000);
  setInterval(()=>{ if(!isCurator&&ME&&tab==='hero'&&!$('#dlg').open) render(); },60000);
})();
</script>
